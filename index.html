<!DOCTYPE html>
<html lang="en">

<head>
	<title>Goz Parrilla | Realidad aumentada</title>
	<meta charset="utf-8">
	<meta name="generator" content="Three.js Editor">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link rel="stylesheet" href="css/app.css">

	<script type="importmap">
	{
		"imports": {
			"three": "./js/three.compat.js",
			"three/addons/": "./js/addons/",
			"mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
		}
	}
	</script>

	<script type="module">
		import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/GLTFLoader.js';
		window.ThreeGLTFLoader = GLTFLoader;
	</script>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
	<style>
		#overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:2rem;text-align:center;
			background:radial-gradient(40rem 24rem at 50% 0,rgba(240,138,28,.28),transparent 70%),#0c0a09;color:#f6efe6;font-family:'DM Sans',system-ui,sans-serif;transition:opacity .4s}
		#overlay.hidden{opacity:0;pointer-events:none}
		#overlay .brand{width:min(220px,60vw);min-height:80px;display:grid;place-items:center}
		#overlay .brand img{max-width:100%}
		#overlay .brand-slot{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:3rem;letter-spacing:.06em}
		#overlay h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.15;max-width:16ch}
		#overlay p.sub{color:#b3a597;max-width:30ch;font-size:1rem;line-height:1.5}
		#start-button{background:linear-gradient(180deg,#ffb454,#f08a1c);color:#1b0f02;border:0;border-radius:999px;padding:1rem 2.4rem;font:700 1.1rem 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 10px 40px rgba(240,138,28,.35)}
		#start-button:active{transform:scale(.97)}
		#progress-container{display:none;flex-direction:column;align-items:center;gap:.6rem;width:min(280px,80vw)}
		#progress-bar-track{width:100%;height:8px;border-radius:99px;background:#2a211a;overflow:hidden}
		#progress-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#f08a1c,#ffb454);border-radius:99px;transition:width .3s}
		#progress-label{font-size:.9rem;color:#b3a597}
		.back{color:#b3a597;font-size:.9rem;text-decoration:underline}
		.log{display:none}
	</style>
</head>

<body ontouchstart="">

	<div id="ar-container"></div>

	<div class="log" id="log"></div>

	<div id="overlay">
		<!-- LOGO: reemplaza el span por <img src="logo.png" alt="Goz Parrilla"> -->
		<div class="brand"><img src="media/Logo.jpeg"></div>
		<h1>Mira nuestros menú en realidad aumentada</h1>
		<p class="sub">Permite el acceso a la cámara y apunta al código para ver el producto sobre tu mesa.</p>
		<button id="start-button">Iniciar</button>
		<div id="progress-container">
			<div id="progress-bar-track">
				<div id="progress-bar-fill"></div>
			</div>
			<div id="progress-label">Cargando... 0%</div>
		</div>
		<a class="back" href="https://TU-WEB-GOZ.com">Volver al menú</a>
	</div>

	<script type="module">

		import * as THREE from './js/three.module.js';
		import { APP } from './js/app.js';
		import { MindARController } from './js/mindar/mindar_controller.js';

		window.THREE = THREE; // Used by APP Scripts.

		const log = document.getElementById('log');
		const overlay = document.getElementById('overlay');
		const startButton = document.getElementById('start-button');
		const arContainer = document.getElementById('ar-container');
		const progressContainer = document.getElementById('progress-container');
		const progressFill = document.getElementById('progress-bar-fill');
		const progressLabel = document.getElementById('progress-label');

		const debugMode = new URLSearchParams(location.search).get('debug') === '1';

		let player = null;
		let mindarController = null;
		let loaded = false;
		let loadPromise = null;

		function setProgress(percent, text) {
			progressFill.style.width = `${percent}%`;
			progressLabel.textContent = `${text} ${percent}%`;
		}

		async function loadEverything() {

			if (loadPromise) return loadPromise;

			loadPromise = (async () => {

				setProgress(0, 'Cargando escena...');

				// Descarga app.json con progreso real (0% - 25%)
				const text = await new Promise((resolve, reject) => {
					const loader = new THREE.FileLoader();
					loader.load(
						'app.json',
						(t) => resolve(t),
						(e) => {
							if (e.lengthComputable) {
								const p = Math.round((e.loaded / e.total) * 25);
								setProgress(p, 'Cargando escena...');
							}
						},
						(err) => reject(new Error(err.statusText || 'No se pudo descargar el json'))
					);
				});

				player = new APP.Player({ alpha: true });
				await player.load(JSON.parse(text));
				player.setSize(window.innerWidth, window.innerHeight);
				player.play();
				setProgress(55, 'Escena lista...');

				document.body.appendChild(player.dom);

				window.addEventListener('resize', function () {
					player.setSize(window.innerWidth, window.innerHeight);
				});

				window.player = player;

				setProgress(85, 'Preparando AR...');
				log.textContent = 'initializing...';

				await new Promise((resolve) => setTimeout(resolve, 10));

				setProgress(100, 'Listo');
				loaded = true;

				console.log(window.player);

			})().catch((e) => {
				loaded = false;
				loadPromise = null; // permite reintentar al pulsar el botón
				throw e;
			});

			return loadPromise;
		}

		// Al darle al botón start se inicia la cámara (requiere gesto del usuario).
		startButton.addEventListener('click', async () => {

			progressContainer.style.display = 'flex';

			try {
				await loadEverything();
				if (!loaded) return;

				setProgress(90, 'Iniciando cámara...');

				// La cámara se inicia aquí, dentro del gesto del usuario.
				mindarController = new MindARController(arContainer, player, debugMode);
				window.mindarController = mindarController;

				await mindarController.start();

				// El player sigue funcionando (scripts/audio) pero su canvas ya no se usa.
				if (player?.dom) player.dom.style.display = 'none';

				overlay.classList.add('hidden');
				setTimeout(() => overlay.remove(), 400);
			} catch (e) {
				console.error('Error durante la carga:', e);
				startButton.textContent = 'Reintentar';
				setProgress(0, 'Error al iniciar');
			}

		});

		// Todo se carga automáticamente al abrir la página.
		loadEverything().catch((e) => {
			console.error('Error durante la carga automática:', e.message);
			progressContainer.style.display = 'flex';
			setProgress(0, 'Error al cargar');
			startButton.textContent = 'Reintentar';
		});

	</script>
</body>

</html>
