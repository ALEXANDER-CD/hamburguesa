<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0a09">
  <title>GÖZ Parrilla | Realidad aumentada</title>
  <meta name="description" content="Disfruta la experiencia de realidad aumentada de GÖZ Parrilla.">
  <meta name="generator" content="Three.js Editor">
  <link rel="stylesheet" href="css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
 
  <script type="importmap">
  {
    "imports": {
      "three": "./js/three.compat.js",
      "three/addons/": "./js/addons/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
 
  <script type="module">
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/GLTFLoader.js';
    window.ThreeGLTFLoader = GLTFLoader;
  </script>
 
  <style>
    :root {
      --ar-bg: #0c0a09;
      --ar-text: #f6efe6;
      --ar-muted: #b3a597;
      --ar-orange: #f08a1c;
      --ar-orange-light: #ffb454;
    }
 
    * { box-sizing: border-box; }
 
    html, body {
      width: 100%;
      min-width: 0;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--ar-bg);
    }
 
    body {
      position: fixed;
      inset: 0;
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }
 
    /* La escena AR ocupa exactamente el viewport, sin márgenes laterales. */
    #ar-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }
 
    #ar-container video,
    #ar-container canvas {
      position: absolute !important;
      inset: 0 !important;
      display: block;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      object-fit: cover;
    }
 
    /* Pantalla inicial: contenido centrado de verdad en móvil y escritorio. */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1rem, 3vh, 1.6rem);
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 100svh;
      margin: 0;
      padding:
        max(1.25rem, env(safe-area-inset-top))
        max(1.25rem, env(safe-area-inset-right))
        max(1.25rem, env(safe-area-inset-bottom))
        max(1.25rem, env(safe-area-inset-left));
      overflow-y: auto;
      text-align: center;
      background:
        radial-gradient(40rem 24rem at 50% 0, rgba(240,138,28,.28), transparent 70%),
        var(--ar-bg);
      color: var(--ar-text);
      font-family: 'DM Sans', system-ui, sans-serif;
      transition: opacity .4s ease;
    }
 
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
 
    #overlay .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: min(240px, 68vw);
      height: clamp(76px, 14vh, 110px);
      min-height: 0;
      margin-inline: auto;
    }
 
    #overlay .brand img {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      margin: 0 auto;
      object-fit: contain;
      object-position: center;
    }
 
    #overlay .brand-slot {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: 3rem;
      letter-spacing: .06em;
    }
 
    #overlay h1 {
      width: 100%;
      max-width: 16ch;
      margin: 0 auto;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.65rem, 6vw, 2.4rem);
      line-height: 1.15;
      text-align: center;
      overflow-wrap: break-word;
    }
 
    #overlay p.sub {
      width: 100%;
      max-width: 30ch;
      margin: 0 auto;
      color: var(--ar-muted);
      font-size: 1rem;
      line-height: 1.5;
      text-align: center;
    }
 
    #start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      max-width: 100%;
      min-height: 54px;
      margin: 0 auto;
      padding: .95rem 2.4rem;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--ar-orange-light), var(--ar-orange));
      color: #1b0f02;
      font: 700 1.1rem 'DM Sans', sans-serif;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(240,138,28,.28);
      -webkit-tap-highlight-color: transparent;
    }
 
    #start-button:active { transform: scale(.97); }
 
    #progress-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      width: min(280px, 80vw);
      margin-inline: auto;
    }
 
    #progress-bar-track {
      width: 100%;
      height: 8px;
      border-radius: 99px;
      background: #2a211a;
      overflow: hidden;
    }
 
    #progress-bar-fill {
      width: 0;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--ar-orange), var(--ar-orange-light));
      transition: width .3s ease;
    }
 
    #progress-label { color: var(--ar-muted); font-size: .9rem; }
    .back { color: var(--ar-muted); font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; }
    .log { display: none; }
 
    @media (max-width: 480px) {
      #overlay {
        gap: 1.1rem;
        padding:
          max(1rem, env(safe-area-inset-top))
          max(1.1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom))
          max(1.1rem, env(safe-area-inset-left));
      }
 
      #overlay .brand {
        width: min(210px, 64vw);
        height: 78px;
      }
 
      #overlay h1 { font-size: clamp(1.65rem, 7vw, 2.1rem); }
      #overlay p.sub { max-width: 29ch; font-size: .96rem; }
      #start-button { width: min(100%, 290px); padding-inline: 1.5rem; }
    }
 
    @media (max-height: 620px) {
      #overlay { justify-content: flex-start; gap: .8rem; }
      #overlay .brand { height: 58px; }
      #overlay h1 { font-size: clamp(1.4rem, 5vh, 1.8rem); }
      #overlay p.sub { font-size: .9rem; }
      #start-button { min-height: 46px; padding-block: .7rem; }
    }
 
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
    /* ===== HUD de productos (centro libre para el AR) ===== */
    [hidden]{display:none!important}
    #hud{position:fixed;inset:0;z-index:50;pointer-events:none;display:none;font-family:'DM Sans',system-ui,sans-serif;color:#f6efe6}
    body.ar-on #hud{display:block}
    #hud button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    #top{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;padding:max(.5rem,env(safe-area-inset-top)) .6rem 0}
    #sheet{width:min(520px,100%);display:flex;flex-direction:column;gap:.45rem;padding:.7rem .8rem .6rem;border-radius:20px;border:1px solid rgba(240,138,28,.8);
      background:rgba(18,15,13,.86);backdrop-filter:blur(14px);transform:translateY(-140%);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s}
    #sheet.open{transform:none;opacity:1;pointer-events:auto}
    .sh-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
    #sh-name{font-family:'Playfair Display',serif;font-size:1.2rem;line-height:1.1;margin:0}
    #sh-tag{color:#b3a597;font-size:.76rem;margin:.1rem 0 0}
    #sh-close,#dt-close{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid #3a2d22;background:rgba(255,255,255,.05);font-size:1rem;line-height:1}
    .chips{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
    .sh-head{flex-shrink:0}
    .chips::-webkit-scrollbar{display:none}
    .chips button{flex:0 0 auto;padding:.3rem .8rem;border-radius:999px;border:1px solid #3a2d22;background:transparent;font-size:.8rem}
    .chips button.on{background:linear-gradient(180deg,#ffb454,#f08a1c);color:#1b0f02;border-color:transparent;font-weight:700}
    #variants:empty{display:none}
    #tabs button{flex:1 1 0;background:rgba(255,255,255,.04);white-space:nowrap}
    #detail{width:min(520px,100%);margin-top:.45rem;max-height:min(30dvh,270px);display:flex;flex-direction:column;gap:.5rem;padding:.7rem .8rem;border-radius:20px;border:1px solid rgba(240,138,28,.6);background:rgba(18,15,13,.92);backdrop-filter:blur(14px);pointer-events:auto;animation:dropin .3s ease}
    #detail h3{margin:0;font-family:'Playfair Display',serif;font-size:1.05rem;color:#ffb454}
    @keyframes dropin{from{opacity:0;transform:translateY(-10px)}}
    #sh-body{overflow-y:auto;min-height:0;display:grid;gap:.4rem;align-content:start;overscroll-behavior:contain}
    .ing{display:grid;gap:.05rem;text-align:left;padding:.5rem .7rem;border-radius:12px;border:1px solid #3a2d22;background:rgba(255,255,255,.04)}
    .ing:active{border-color:#f08a1c}
    .ing b{color:#ffb454;font-size:.88rem}.ing span{color:#b3a597;font-size:.78rem;line-height:1.3}
    #sh-body dl{margin:0;display:grid}
    #sh-body dl div{display:flex;justify-content:space-between;gap:1rem;padding:.45rem .1rem;border-bottom:1px solid #2a211a;font-size:.84rem}
    #sh-body dt{color:#ffb454}#sh-body dd{margin:0;color:#d8cdc0;text-align:right}
    .al{margin:0;font-size:.88rem;color:#e6dccf}.note{margin:0;font-size:.74rem;color:#b3a597}
    #peek{margin-top:.2rem;padding:.4rem .9rem;border-radius:999px;border:1px solid rgba(240,138,28,.8);background:rgba(18,15,13,.8);backdrop-filter:blur(10px);font-size:.82rem;pointer-events:auto}
    #bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:0 .6rem max(.6rem,env(safe-area-inset-bottom))}
    #hint{padding:.35rem .9rem;border-radius:999px;background:rgba(12,10,9,.7);backdrop-filter:blur(10px);border:1px solid #3a2d22;font-size:.82rem;transition:opacity .4s}
    #hint.gone{display:none}
    #actions{display:flex;gap:.5rem;pointer-events:auto}
    #actions a,#actions button{padding:.5rem 1rem;border-radius:999px;border:1px solid rgba(240,138,28,.8);background:rgba(18,15,13,.8);backdrop-filter:blur(10px);font-size:.84rem;font-weight:700;text-decoration:none;color:#f6efe6}
    #actions .go{background:linear-gradient(180deg,#ffb454,#f08a1c);color:#1b0f02;border-color:transparent}
    #actions .on{background:rgba(240,138,28,.3)}
    #deck{width:min(520px,100%);display:flex;gap:.5rem;pointer-events:auto}
    .pcard{flex:1 1 0;min-width:0;display:grid;justify-items:center;gap:0;padding:.45rem .3rem;border-radius:16px;border:1px solid #3a2d22;background:rgba(18,15,13,.8);backdrop-filter:blur(12px);transition:transform .25s,border-color .25s,background .25s}
    .pcard .ico{font-size:1.4rem;line-height:1.2}
    .pcard b{font-family:'Playfair Display',serif;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .pcard.on{border-color:#f08a1c;background:rgba(240,138,28,.22);transform:translateY(-3px)}
  </style>
</head>
 
<body>
  <div id="ar-container" aria-label="Vista de realidad aumentada"></div>
  <div class="log" id="log"></div>
 
  <div id="overlay">
    <div class="brand">
      <img src="assets/Logo.png" alt="GÖZ Parrilla">
    </div>
    <h1>Disfruta de nuestra experiencia AR</h1>
    <p class="sub">Permite el acceso a la cámara y apunta al código para ver el producto sobre tu mesa.</p>
    <button id="start-button" type="button">Iniciar</button>
    <div id="progress-container" aria-live="polite">
      <div id="progress-bar-track">
        <div id="progress-bar-fill"></div>
      </div>
      <div id="progress-label">Cargando... 0%</div>
    </div>
    <a class="back" href="https://TU-WEB-GOZ.com">Volver al menú</a>
  </div>
 
  <div id="hud">
    <div id="top">
      <section id="sheet" aria-live="polite">
        <div class="sh-head">
          <div><h2 id="sh-name"></h2><p id="sh-tag"></p></div>
          <button id="sh-close" aria-label="Cerrar ficha">✕</button>
        </div>
        <div class="chips" id="variants"></div>
        <div class="chips" id="tabs"></div>
        </section>
      <section id="detail" hidden>
        <div class="sh-head"><h3 id="dt-title"></h3><button id="dt-close" aria-label="Cerrar">✕</button></div>
        <div id="sh-body"></div>
      </section>
      <button id="peek" hidden>Ver ficha ▾</button>
    </div>
    <div id="bottom">
      <div id="hint">Apunta al código y elige un producto</div>
      <div id="actions" hidden>
        <button id="explode">Separar ingredientes</button>
        <a id="order" class="go" href="#" target="_blank" rel="noopener">Pedir</a>
      </div>
      <nav id="deck" aria-label="Productos"></nav>
    </div>
  </div>
 
  <script type="module">
    import * as THREE from './js/three.module.js';
    import { APP } from './js/app.js';
    import { MindARController } from './js/mindar/mindar_controller.js';
    import { PRODUCTS, createGoz } from './js/goz-products.js';
 
    window.THREE = THREE;
 
    const log = document.getElementById('log');
    const overlay = document.getElementById('overlay');
    const startButton = document.getElementById('start-button');
    const arContainer = document.getElementById('ar-container');
    const progressContainer = document.getElementById('progress-container');
    const progressFill = document.getElementById('progress-bar-fill');
    const progressLabel = document.getElementById('progress-label');
 
    const debugMode = new URLSearchParams(location.search).get('debug') === '1';
 
    let player = null;
    let mindarController = null;
    let loaded = false;
    let loadPromise = null;
 
    function setProgress(percent, message) {
      const value = Math.max(0, Math.min(100, percent));
      progressFill.style.width = `${value}%`;
      progressLabel.textContent = `${message} ${value}%`;
    }
 
    async function loadEverything() {
      if (loadPromise) return loadPromise;
 
      loadPromise = (async () => {
        setProgress(0, 'Cargando escena...');
 
        const jsonText = await new Promise((resolve, reject) => {
          const loader = new THREE.FileLoader();
          loader.load(
            'app.json',
            resolve,
            event => {
              if (event.lengthComputable) {
                setProgress(Math.round((event.loaded / event.total) * 25), 'Cargando escena...');
              }
            },
            error => reject(new Error(error?.statusText || 'No se pudo descargar app.json'))
          );
        });
 
        player = new APP.Player({ alpha: true });
        await player.load(JSON.parse(jsonText));
        player.setSize(window.innerWidth, window.innerHeight);
        player.play();
 
        document.body.appendChild(player.dom);
 
        // El canvas auxiliar de Three.js no debe interferir con la vista AR.
        if (player.dom) {
          player.dom.style.position = 'fixed';
          player.dom.style.left = '0';
          player.dom.style.top = '0';
          player.dom.style.maxWidth = '100%';
        }
 
        window.addEventListener('resize', () => {
          if (player) player.setSize(window.innerWidth, window.innerHeight);
        }, { passive: true });
 
        window.player = player;
        setProgress(85, 'Preparando AR...');
        log.textContent = 'initializing...';
        await new Promise(resolve => setTimeout(resolve, 10));
 
        setProgress(100, 'Listo');
        loaded = true;
        console.log(window.player);
      })().catch(error => {
        loaded = false;
        loadPromise = null;
        throw error;
      });
 
      return loadPromise;
    }
 
    // ===== HUD de productos: carrusel + ficha =====
    function initGoz() {
      const mount = mindarController.anchors?.[0]?.group, cam = mindarController.mindar?.camera;
      if (!mount || !cam) { console.warn('[Goz] No se encontró el ancla o la cámara de MindAR'); return; }
      // Neutraliza la hamburguesa antigua del editor (modelo + panel viejo), pero deja vivo su script de audio.
      mindarController.threePlayer?.imageTargets?.forEach((it) => {
        const old = it.arContent?.children?.[0];
        if (!old) return;
        old.onClick = null;
        old.traverse((o) => { if (o.isMesh) o.visible = false; });
      });
 
      const $ = (id) => document.getElementById(id);
      const sheet = $('sheet'), deck = $('deck'), body = $('sh-body');
      const WHATSAPP = '573000000000'; // ← cambia por el número real (con indicativo, sin +)
      let pi = -1, vi = 0, tab = null, exploded = false;
      const goz = createGoz({ mount, camera: cam, dom: arContainer, onTap: () => setOpen(true) });
 
      deck.innerHTML = PRODUCTS.map((p, i) => `<button class="pcard" data-i="${i}"><span class="ico">${p.icon}</span><b>${p.name}</b></button>`).join('');
 
      function setOpen(o) { sheet.classList.toggle('open', o); $('peek').hidden = o || pi < 0; $('detail').hidden = !o || !tab; }
 
      function render() {
        const p = PRODUCTS[pi], v = p.variants[vi];
        const al = v.specs.find((x) => x[0].startsWith('Contiene'));
        const specs = v.specs.filter((x) => x !== al);
        const tabs = [['ing', '🧾 Ingredientes'], ['spec', '📋 Ficha']];
        if (al) tabs.push(['al', '⚠️ Alérgenos']);
        if (tab && !tabs.some((t) => t[0] === tab)) tab = null;
 
        $('sh-name').textContent = `${p.icon} ${p.name}`;
        $('sh-tag').textContent = p.tag;
        $('variants').innerHTML = p.variants.length > 1 ? p.variants.map((x, j) => `<button data-v="${j}" class="${j === vi ? 'on' : ''}">${x.label}</button>`).join('') : '';
        $('tabs').innerHTML = tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('');
        $('dt-title').textContent = tab ? tabs.find((t) => t[0] === tab)[1].replace(/^\S+\s/, '') : '';
        $('detail').hidden = !tab || !sheet.classList.contains('open');
        body.innerHTML = !tab ? '' :
          tab === 'ing' ? v.ingredients.map((g) => `<button class="ing" data-part="${g.part}"><b>${g.name}</b><span>${g.detail || ''}</span></button>`).join('') :
          tab === 'spec' ? `<dl>${specs.map(([k, val]) => `<div><dt>${k}</dt><dd>${val}</dd></div>`).join('')}</dl>` :
          `<p class="al">${al[1]}</p><p class="note">Información de referencia. Si tienes alguna alergia, confírmala con el local.</p>`;
        const label = p.variants.length > 1 ? `${p.name} ${v.label}` : p.name;
        $('order').href = `https://wa.me/${WHATSAPP}?text=` + encodeURIComponent(`Hola, quiero pedir: ${label}.`);
      }
 
      function select(i) {
        if (i === pi) { setOpen(!sheet.classList.contains('open')); return; }
        pi = i; vi = 0; tab = null; render();
        goz.show(PRODUCTS[pi], vi); goz.setExplode(exploded);
        setOpen(true); $('hint').classList.add('gone'); $('actions').hidden = false;
        deck.querySelectorAll('.pcard').forEach((c, j) => c.classList.toggle('on', j === i));
      }
 
      $('bottom').addEventListener('click', (e) => {
        const c = e.target.closest('.pcard'); if (c) return select(+c.dataset.i);
        if (e.target.id === 'explode') {
          exploded = !exploded; e.target.classList.toggle('on', exploded);
          e.target.textContent = exploded ? 'Juntar ingredientes' : 'Separar ingredientes'; goz.setExplode(exploded);
        }
      });
      $('peek').addEventListener('click', () => setOpen(true));
      $('detail').addEventListener('click', (e) => {
        const t = e.target.closest('button'); if (!t) return;
        if (t.id === 'dt-close') { tab = null; render(); }
        else if (t.dataset.part) goz.highlight(t.dataset.part);
      });
      sheet.addEventListener('click', (e) => {
        const t = e.target.closest('button'); if (!t) return;
        if (t.id === 'sh-close') setOpen(false);
        else if (t.dataset.v) { vi = +t.dataset.v; render(); goz.show(PRODUCTS[pi], vi); goz.setExplode(exploded); }
        else if (t.dataset.tab) { tab = tab === t.dataset.tab ? null : t.dataset.tab; render(); }
        else if (t.dataset.part) goz.highlight(t.dataset.part);
      });
    }
 
    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      startButton.textContent = 'Iniciando...';
      progressContainer.style.display = 'flex';
 
      try {
        await loadEverything();
        if (!loaded) return;
 
        setProgress(90, 'Iniciando cámara...');
        mindarController = new MindARController(arContainer, player, debugMode);
        window.mindarController = mindarController;
 
        await mindarController.start();
 
        if (player?.dom) player.dom.style.display = 'none';
 
        overlay.classList.add('hidden');
        document.body.classList.add('ar-on');
        initGoz();
        window.setTimeout(() => overlay.remove(), 400);
      } catch (error) {
        console.error('Error durante la carga o el inicio de AR:', error);
        startButton.disabled = false;
        startButton.textContent = 'Reintentar';
        setProgress(0, 'No se pudo iniciar');
      }
    });
 
    // Precarga de la escena; la cámara solo se solicita al tocar Iniciar.
    loadEverything().catch(error => {
      console.error('Error durante la carga automática:', error);
      progressContainer.style.display = 'flex';
      setProgress(0, 'Error al cargar');
      startButton.disabled = false;
      startButton.textContent = 'Reintentar';
    });
  </script>
</body>
</html>
